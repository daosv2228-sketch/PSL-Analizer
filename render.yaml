services:
  - type: web
    name: looksmax-backend-api
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps
    startCommand: npx tsx server.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
