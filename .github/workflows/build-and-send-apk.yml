name: Build Android APK and Send to Phone

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK & Distribute to Phone
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync with Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          CI: true

      - name: Locate Generated APK
        id: apk_info
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found after assembleDebug!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psl-analyzer-debug-apk
          path: ${{ steps.apk_info.outputs.apk_path }}
          retention-days: 14

      - name: Send APK to Telegram (if configured)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        continue-on-error: true
        run: |
          echo "Sending APK to Telegram chat: ${{ env.TELEGRAM_CHAT_ID }}..."
          CAPTION="🚀 PSL Face Analyzer — Свежая сборка APK!
          📦 Размер: ${{ steps.apk_info.outputs.apk_size }}
          ⏱ Собрано: ${{ env.BUILD_TIME }}
          👉 Нажмите на файл в Telegram, чтобы установить приложение на смартфон."

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendDocument" \
               -F "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
               -F "document=@${{ steps.apk_info.outputs.apk_path }};filename=PSL_Analyzer_Debug.apk" \
               -F "caption=$CAPTION")
          
          echo "Telegram Response: $RESPONSE"

      - name: Add Step Summary
        run: |
          echo "### 📱 Android APK успешно собран!" >> $GITHUB_STEP_SUMMARY
          echo "- **Размер:** ${{ steps.apk_info.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Время сборки:** ${{ env.BUILD_TIME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Файл доступен:** во вкладке **Artifacts** этого запуска workflow." >> $GITHUB_STEP_SUMMARY
