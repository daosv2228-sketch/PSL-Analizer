name: Build Android APK and Send to Phone

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      notify_telegram:
        description: 'Send APK directly to Telegram bot?'
        required: true
        type: boolean
        default: true

jobs:
  build-apk:
    name: Build Debug APK & Distribute to Phone
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync with Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          CI: true

      - name: Locate Generated APK
        id: apk_info
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: psl-analyzer-debug-apk
          path: ${{ steps.apk_info.outputs.apk_path }}
          retention-days: 14

      - name: Upload APK to Temporary Direct Cloud Link
        id: upload_cloud
        continue-on-error: true
        run: |
          echo "Uploading APK for instant direct mobile download..."
          UPLOAD_RESPONSE=$(curl -s -F "file=@${{ steps.apk_info.outputs.apk_path }}" https://file.io/?expires=1d || true)
          echo "Response: $UPLOAD_RESPONSE"
          DOWNLOAD_URL=$(echo "$UPLOAD_RESPONSE" | grep -o '"link":"[^"]*"' | cut -d'"' -f4 || true)
          if [ -n "$DOWNLOAD_URL" ]; then
            echo "direct_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
            echo "Direct Mobile Download: $DOWNLOAD_URL"
          fi

      - name: Send APK to Telegram on Phone
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Sending APK to Telegram..."
          CAPTION="🚀 *PSL Face Analyzer — Свежая сборка APK!*
          
📱 *Файл:* \`PSL_Analyzer_Debug.apk\`
📦 *Размер:* ${{ steps.apk_info.outputs.apk_size }}
⏱ *Собрано:* ${{ env.BUILD_TIME }}
💬 *Коммит:* \`${{ github.event.head_commit.message || 'Ручной запуск' }}\`
🔗 *Ветка:* \`${{ github.ref_name }}\`

👉 Нажмите на файл в Telegram, чтобы установить приложение на смартфон."

          curl -v -F "chat_id=$TELEGRAM_CHAT_ID" \
               -F "document=@${{ steps.apk_info.outputs.apk_path }};filename=PSL_Analyzer_Debug.apk" \
               -F "caption=$CAPTION" \
               -F "parse_mode=Markdown" \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

      - name: Generate Summary and QR Code
        run: |
          echo "### 📱 Android APK успешно собран!" >> $GITHUB_STEP_SUMMARY
          echo "- **Размер:** ${{ steps.apk_info.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Время сборки:** ${{ env.BUILD_TIME }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.upload_cloud.outputs.direct_url }}" ]; then
            echo "- **Ссылка для прямой загрузки:** [Скачать APK](${{ steps.upload_cloud.outputs.direct_url }})" >> $GITHUB_STEP_SUMMARY
            echo "![QR Code](https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${{ steps.upload_cloud.outputs.direct_url }})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Вы также можете скачать файл прямо из секции **Artifacts** этого workflow." >> $GITHUB_STEP_SUMMARY
